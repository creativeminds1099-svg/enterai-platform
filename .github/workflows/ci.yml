name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fixtures-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/seed_sample_data.py

  api-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --workspaces
      - run: npm run build -w @enterai/shared-types
      - run: npm run build -w @enterai/api

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --workspaces
      - run: npm run build -w @enterai/shared-types
      - run: npm run build -w @enterai/web

  collectors-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m py_compile $(find services agents -name '*.py')
